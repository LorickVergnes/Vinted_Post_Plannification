<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier l'annonce - Vinted Post</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav id="main-nav"></nav>

    <main>
        <h1>Modifier l'annonce</h1>
        
        <form action="#" class="annonce-form">

            <!-- Section Photos -->
            <div class="form-section">
                <div class="section-title">
                    <i data-feather="image"></i> Photos de l'article
                </div>
                <div class="form-group full-width">
                    <label for="photos" class="file-drop-zone">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                        <p>Glissez vos photos ici</p>
                        <span>ou cliquez pour parcourir (max. 10)</span>
                    </label>
                    <input type="file" id="photos" name="photos" multiple accept="image/*" class="is-hidden">
                    <div id="photos-preview" class="photos-preview-container"></div>
                </div>
            </div>

            <!-- Section Détails -->
            <div class="form-section">
                <div class="section-title">
                    <i data-feather="edit-3"></i> Informations principales
                </div>
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label for="titre">Titre de l'annonce</label>
                        <input type="text" id="titre" name="titre" required placeholder="Ex: T-shirt Nike Vintage">
                    </div>

                    <div class="form-group full-width">
                        <label for="description">Description détaillée</label>
                        <textarea id="description" name="description" rows="6" required placeholder="Décrivez l'état, la coupe, etc."></textarea>
                    </div>

                    <div class="form-group autocomplete-container">
                        <label for="categorie">Catégorie</label>
                        <input type="text" id="categorie" name="categorie" required autocomplete="off" placeholder="Chercher une catégorie...">
                        <div id="categorie-suggestions" class="suggestions-container"></div>
                    </div>

                    <div class="form-group autocomplete-container">
                        <label for="marque">Marque</label>
                        <input type="text" id="marque" name="marque" required autocomplete="off" placeholder="Ex: Levi's">
                        <div id="marque-suggestions" class="suggestions-container"></div>
                    </div>
                </div>
            </div>

            <!-- Section Attributs -->
            <div class="form-section">
                <div class="section-title">
                    <i data-feather="settings"></i> Caractéristiques
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="taille">Taille / Pointure</label>
                        <select id="taille" name="taille">
                            <option value="" disabled selected>Choisir...</option>
                            <optgroup label="Vêtements">
                                <option value="XXS">XXS</option>
                                <option value="XS">XS</option>
                                <option value="S">S</option>
                                <option value="M">M</option>
                                <option value="L">L</option>
                                <option value="XL">XL</option>
                                <option value="Taille unique">Taille unique</option>
                            </optgroup>
                            <optgroup label="Pointures">
                                <option value="36">36</option>
                                <option value="37">37</option>
                                <option value="38">38</option>
                                <option value="39">39</option>
                                <option value="40">40</option>
                                <option value="41">41</option>
                                <option value="42">42</option>
                            </optgroup>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="etat">État de l'article</label>
                        <select id="etat" name="etat" required>
                            <option value="Neuf avec étiquette">Neuf avec étiquette</option>
                            <option value="Neuf sans étiquette">Neuf sans étiquette</option>
                            <option value="Très bon état">Très bon état</option>
                            <option value="Bon état">Bon état</option>
                            <option value="Satisfaisant">Satisfaisant</option>
                        </select>
                    </div>

                    <div class="form-group full-width">
                        <label>Couleurs (2 max)</label>
                        <input type="hidden" name="couleur" id="couleur-input" required>
                        <div class="tag-container" id="couleur-tags" data-limit="2">
                            <div class="tag-option" data-value="Noir">Noir</div>
                            <div class="tag-option" data-value="Blanc">Blanc</div>
                            <div class="tag-option" data-value="Gris">Gris</div>
                            <div class="tag-option" data-value="Bleu">Bleu</div>
                            <div class="tag-option" data-value="Rouge">Rouge</div>
                            <div class="tag-option" data-value="Vert">Vert</div>
                            <div class="tag-option" data-value="Beige">Beige</div>
                        </div>
                    </div>

                    <div class="form-group full-width">
                        <label>Matériaux (3 max)</label>
                        <input type="hidden" name="materiaux" id="materiaux-input">
                        <div class="tag-container" id="materiaux-tags" data-limit="3">
                            <div class="tag-option" data-value="Coton">Coton</div>
                            <div class="tag-option" data-value="Cuir">Cuir</div>
                            <div class="tag-option" data-value="Laine">Laine</div>
                            <div class="tag-option" data-value="Soie">Soie</div>
                            <div class="tag-option" data-value="Polyester">Polyester</div>
                            <div class="tag-option" data-value="Jean">Jean</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Section Logistique -->
            <div class="form-section">
                <div class="section-title">
                    <i data-feather="truck"></i> Prix & Livraison
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="prix">Prix de vente (€)</label>
                        <input type="number" id="prix" name="prix" step="0.01" required placeholder="0.00">
                    </div>

                    <div class="form-group">
                        <label for="formatColis">Format du colis</label>
                        <select id="formatColis" name="formatColis" required>
                            <option value="Petit">Petit</option>
                            <option value="Moyen">Moyen</option>
                            <option value="Grand">Grand</option>
                        </select>
                    </div>

                    <div class="form-group full-width">
                        <label for="isSold" class="form-switch">
                            Article déjà vendu ?
                            <input type="checkbox" id="isSold" name="isSold">
                            <span class="slider"></span>
                        </label>
                    </div>

                    <div class="form-group">
                        <label for="datePublication">Date de publication</label>
                        <input type="date" id="datePublication" name="datePublication" required>
                    </div>

                    <div class="form-group">
                        <label for="repetition">Répétition</label>
                        <select id="repetition" name="repetition">
                            <option value="0" selected>Jamais</option>
                            <option value="7">Toutes les semaines</option>
                            <option value="14">Toutes les 2 semaines</option>
                            <option value="30">Tous les mois</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-actions" style="display: flex; gap: 15px;">
                <button type="submit" class="btn-submit">Mettre à jour</button>
                <button type="button" id="delete-btn" class="btn-delete" style="background: #fee2e2; color: #ef4444; border: none; padding: 14px; border-radius: var(--radius-sm); cursor: pointer; font-weight: 700; flex: 0 0 200px;">Supprimer</button>
            </div>

        </form>
    </main>

    <script src="https://unpkg.com/feather-icons"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
