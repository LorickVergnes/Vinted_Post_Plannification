<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toutes les Annonces</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <a href="/index.html">Créer une annonce</a>
        <a href="/all.html" class="active">Toutes les annonces</a>
        <a href="/today.html">Annonces du jour</a>
        <a href="/sold.html">Annonces vendues</a>
    </nav>

    <main>
        <h1>Toutes mes annonces</h1>

        <div class="view-switcher">
            <button id="grid-view-btn" class="active">Vue Grille</button>
            <button id="calendar-view-btn">Vue Calendrier</button>
        </div>

        <div id="grid-view" class="grid-container">
            <!-- Les annonces en grille seront injectées ici -->
        </div>

        <div id="calendar-view" class="is-hidden">
            <!-- La vue calendrier sera injectée ici -->
        </div>

        <!-- Modale pour assigner une annonce -->
        <div id="assign-modal-container" class="modal-container"></div>
    </main>

    <script src="app.js"></script>
</body>
</html>
