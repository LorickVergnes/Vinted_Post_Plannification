<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Vinted Post</title>
    <link rel="icon" type="image/png" href="assets/img/logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

<div class="login-container">
    <div class="brand-header">
        <h1>Vinted Post</h1>
        <p id="auth-subtitle">Gérez vos brouillons avec style</p>
    </div>

    <div class="login-tabs">
        <button class="tab-btn active" id="tab-login">Connexion</button>
        <button class="tab-btn" id="tab-signup">Inscription</button>
    </div>

    <div id="auth-error"></div>

    <form id="auth-form" class="login-form">
        <div class="form-group">
            <label for="email">Adresse email</label>
            <input type="email" id="email" required placeholder="nom@exemple.com">
        </div>
        <div class="form-group">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn-submit" id="submit-btn">Se connecter</button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const supabaseUrl = 'https://sjeidyhfbkyiahdshxga.supabase.co';
    const supabaseKey = 'sb_publishable_JkZUUkVm-gP7qTM6fO7Spg_O72AdAmd';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    const authForm = document.getElementById('auth-form');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const authError = document.getElementById('auth-error');
    const submitBtn = document.getElementById('submit-btn');
    const tabLogin = document.getElementById('tab-login');
    const tabSignup = document.getElementById('tab-signup');
    const authSubtitle = document.getElementById('auth-subtitle');

    let isLogin = true;

    tabLogin.addEventListener('click', () => {
        isLogin = true;
        tabLogin.classList.add('active');
        tabSignup.classList.remove('active');
        submitBtn.textContent = 'Se connecter';
        authSubtitle.textContent = 'Gérez vos brouillons avec style';
        authError.textContent = '';
    });

    tabSignup.addEventListener('click', () => {
        isLogin = false;
        tabSignup.classList.add('active');
        tabLogin.classList.remove('active');
        submitBtn.textContent = 'Créer un compte';
        authSubtitle.textContent = 'Rejoignez l\'aventure Vinted Post';
        authError.textContent = '';
    });

    authForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        authError.textContent = '';
        submitBtn.disabled = true;
        submitBtn.style.opacity = '0.7';

        const email = emailInput.value;
        const password = passwordInput.value;

        try {
            let result;
            if (isLogin) {
                result = await _supabase.auth.signInWithPassword({ email, password });
            } else {
                result = await _supabase.auth.signUp({ email, password });
                if (!result.error && result.data.user && result.data.session === null) {
                    alert("Compte créé ! Vous pouvez maintenant vous connecter.");
                    tabLogin.click();
                    submitBtn.disabled = false;
                    submitBtn.style.opacity = '1';
                    return;
                }
            }

            if (result.error) throw result.error;
            window.location.href = 'index.html';

        } catch (error) {
            authError.textContent = error.message;
        } finally {
            submitBtn.disabled = false;
            submitBtn.style.opacity = '1';
        }
    });

    async function checkSession() {
        const { data } = await _supabase.auth.getSession();
        if (data.session) {
            window.location.href = 'index.html';
        }
    }
    checkSession();
</script>
</body>
</html>
