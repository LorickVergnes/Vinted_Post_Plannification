<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Vinted Post</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .login-tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid #ddd;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: none;
            cursor: pointer;
            font-weight: bold;
            color: #666;
        }
        .tab-btn.active {
            color: var(--primary-color, #007782);
            border-bottom: 2px solid var(--primary-color, #007782);
        }
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .is-hidden { display: none; }
    </style>
</head>
<body class="bg-light">

    <div class="login-container">
        <h1 style="text-align: center; margin-bottom: 20px;">Vinted Post</h1>
        
        <div class="login-tabs">
            <button class="tab-btn active" id="tab-login">Connexion</button>
            <button class="tab-btn" id="tab-signup">Créer un compte</button>
        </div>

        <form id="auth-form" class="login-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="votre@email.com">
            </div>
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-submit" id="submit-btn">Se connecter</button>
            <p id="auth-error" style="color: red; font-size: 0.9em; text-align: center;"></p>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://sjeidyhfbkyiahdshxga.supabase.co';
        const supabaseKey = 'sb_publishable_JkZUUkVm-gP7qTM6fO7Spg_O72AdAmd';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        const authForm = document.getElementById('auth-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const authError = document.getElementById('auth-error');
        const submitBtn = document.getElementById('submit-btn');
        const tabLogin = document.getElementById('tab-login');
        const tabSignup = document.getElementById('tab-signup');

        let isLogin = true;

        tabLogin.addEventListener('click', () => {
            isLogin = true;
            tabLogin.classList.add('active');
            tabSignup.classList.remove('active');
            submitBtn.textContent = 'Se connecter';
            authError.textContent = '';
        });

        tabSignup.addEventListener('click', () => {
            isLogin = false;
            tabSignup.classList.add('active');
            tabLogin.classList.remove('active');
            submitBtn.textContent = 'Créer un compte';
            authError.textContent = '';
        });

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            authError.textContent = '';
            submitBtn.disabled = true;
            
            const email = emailInput.value;
            const password = passwordInput.value;

            try {
                let result;
                if (isLogin) {
                    result = await _supabase.auth.signInWithPassword({ email, password });
                } else {
                    result = await _supabase.auth.signUp({ email, password });
                    if (!result.error && result.data.user && result.data.session === null) {
                        alert("Compte créé ! Vérifiez vos emails si la confirmation est activée, sinon vous pouvez vous connecter.");
                        isLogin = true;
                        tabLogin.click();
                        submitBtn.disabled = false;
                        return;
                    }
                }

                if (result.error) throw result.error;

                // Rediriger vers l'accueil après connexion
                window.location.href = 'index.html';

            } catch (error) {
                authError.textContent = error.message;
            } finally {
                submitBtn.disabled = false;
            }
        });

        // Vérifier si déjà connecté
        async function checkSession() {
            const { data } = await _supabase.auth.getSession();
            if (data.session) {
                window.location.href = 'index.html';
            }
        }
        checkSession();
    </script>
</body>
</html>
