<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toutes mes annonces - Vinted Post</title>
    <link rel="icon" type="image/png" href="assets/img/logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav id="main-nav"></nav>

    <main>
        <div class="page-header">
            <h1>Mes annonces</h1>
            <div class="view-switcher">
                <button id="grid-view-btn" class="active"><i data-feather="grid"></i> Grille</button>
                <button id="calendar-view-btn"><i data-feather="calendar"></i> Calendrier</button>
            </div>
        </div>

        <div id="grid-view" class="grid-container">
            <!-- Les annonces en grille seront injectées ici -->
        </div>

        <div id="calendar-view" class="is-hidden">
            <!-- La vue calendrier sera injectée ici -->
        </div>

        <!-- Modale pour assigner une annonce -->
        <div id="assign-modal-container" class="modal-container"></div>
    </main>

    <script src="https://unpkg.com/feather-icons"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
